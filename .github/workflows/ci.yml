name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      # No --select here on purpose: the rule set lives in pyproject.toml so the
      # repo lints identically in CI and on a laptop.
      - name: Run ruff
        run: ruff check axiom_ext_langgraph tests

  unit-tests:
    name: Unit Tests (${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The shim's own tests take their dependencies as parameters. They do
      # not need a configured platform. The test extra installs axiom-tests,
      # the AEOS conformance plugin, which is not the platform. A test that
      # needs a live gateway is a design regression — fix the seam.
      - name: Install (test extras, no platform)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          # AEOS standard suite. Not the platform, and not on PyPI.
          pip install "axiom-tests @ git+https://github.com/b-tree-labs/axiom-os.git@0216abc984c071ddf56f625ad7b8076ed34fe58d#subdirectory=packages/axiom-tests"
      - name: Run unit tests
        run: pytest -q --tb=short --timeout=60

  graph-integration:
    name: Real LangGraph
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with langgraph
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "axiom-tests @ git+https://github.com/b-tree-labs/axiom-os.git@0216abc984c071ddf56f625ad7b8076ed34fe58d#subdirectory=packages/axiom-tests"
      # Proves AxiomChatModel satisfies the contract a real prebuilt graph
      # expects, which unit tests against langchain-core alone cannot show.
      - name: Build and run a graph against a stub gateway
        run: pytest -q -m graph --tb=short --timeout=120
